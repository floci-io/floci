  # sumaform (uyuni-project/sumaform) backend_modules/aws/base/ami.tf declares one
  # data "aws_ami" block per supported guest OS, feeding a single `ami_info` local
  # that every host module call reads via lookup() - so ALL of these data sources
  # are evaluated unconditionally on every apply, even ones for an OS family the
  # estate never actually launches an instance from (the same unconditional-eval
  # shape ami-eksworker above exists for). Floci's catalog had zero AWS-owned SUSE,
  # Red Hat or Rocky Linux entries, so every one of these returned zero results -
  # not an EC2 gap, an AMI catalog gap, discovered crossing sumaform's own AWS
  # backend (main.tf.aws.example) against choudoufu/floci.
  #
  # Owner IDs are SUSE's and Red Hat's and Rocky Linux's real, documented AWS
  # publisher accounts (679593333241 SUSE, 013907871322 AWS Marketplace SLES BYOL,
  # 792107900819 Rocky Linux, 309956199498 Red Hat), and each `name` is shaped to
  # match that data source's own name_regex - name_regex filtering itself happens
  # client-side in the AWS provider, not in Floci, so Floci only needs to return a
  # candidate whose owner/architecture/name make it through DescribeImages. None of
  # these are ever actually launched by an instance in this fix's own coverage (the
  # sumaform crossing picks ubuntu2204 for every host it creates), so the guest
  # behind each is the same untargeted default already used for the metadata-only
  # entries above - these exist purely so the data source resolves, not to model a
  # bootable SUSE/RHEL/Rocky guest.
  - imageId: ami-sumaform-opensuse160o
    dockerImage: public.ecr.aws/amazonlinux/amazonlinux:2023
    name: openSUSE-Leap-16-0-v20260101-hvm-ssd-x86_64
    description: sumaform AMI catalog placeholder - openSUSE Leap 16.0
    ownerId: "679593333241"
    architecture: x86_64
    creationDate: "2026-01-01T00:00:00.000Z"

