# EKS Auto Mode compute on a Floci cluster: the NodePool, NodeClass and NodeClaim kinds Auto Mode installs, its
# default NodeClass, and the built-in node pools the cluster's computeConfig.nodePools names (appended by Floci).
# Floci launches nodes for pods its pools' nodes could take and keeps a NodeClaim for each.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.karpenter.sh
  labels:
    app.kubernetes.io/managed-by: floci
spec:
  group: karpenter.sh
  scope: Cluster
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    singular: nodepool
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeclasses.eks.amazonaws.com
  labels:
    app.kubernetes.io/managed-by: floci
spec:
  group: eks.amazonaws.com
  scope: Cluster
  names:
    kind: NodeClass
    listKind: NodeClassList
    plural: nodeclasses
    singular: nodeclass
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeclaims.karpenter.sh
  labels:
    app.kubernetes.io/managed-by: floci
spec:
  group: karpenter.sh
  scope: Cluster
  names:
    kind: NodeClaim
    listKind: NodeClaimList
    plural: nodeclaims
    singular: nodeclaim
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .metadata.labels.node\.kubernetes\.io/instance-type
    - name: Capacity
      type: string
      jsonPath: .metadata.labels.karpenter\.sh/capacity-type
    - name: Zone
      type: string
      jsonPath: .metadata.labels.topology\.kubernetes\.io/zone
    - name: Node
      type: string
      jsonPath: .status.nodeName
    - name: Ready
      type: string
      jsonPath: '.status.conditions[?(@.type=="Ready")].status'
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    - name: ID
      type: string
      jsonPath: .status.providerID
      priority: 1
    - name: NodePool
      type: string
      jsonPath: .metadata.labels.karpenter\.sh/nodepool
      priority: 1
    - name: NodeClass
      type: string
      jsonPath: .spec.nodeClassRef.name
      priority: 1
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
# The default NodeClass, which Floci leaves out without a node role.
---
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: default
  labels:
    app.kubernetes.io/managed-by: eks
spec:
  role: "%ROLE%"
  subnetSelectorTerms:%SUBNET_TERMS%
  securityGroupSelectorTerms:%SECURITY_GROUP_TERMS%
  ephemeralStorage:
    size: 80Gi
    iops: 3000
    throughput: 125
  networkPolicy: DefaultAllow
  networkPolicyEventLogs: Disabled
  snatPolicy: Random
