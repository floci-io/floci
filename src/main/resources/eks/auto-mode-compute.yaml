# EKS Auto Mode compute on a Floci cluster: the NodePool and NodeClass kinds Auto Mode installs, its default
# NodeClass, and the built-in node pools the cluster's computeConfig.nodePools names (appended by Floci).
# Floci launches no nodes for them; workloads run on the cluster's node.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.karpenter.sh
  labels:
    app.kubernetes.io/managed-by: floci
spec:
  group: karpenter.sh
  scope: Cluster
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    singular: nodepool
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeclasses.eks.amazonaws.com
  labels:
    app.kubernetes.io/managed-by: floci
spec:
  group: eks.amazonaws.com
  scope: Cluster
  names:
    kind: NodeClass
    listKind: NodeClassList
    plural: nodeclasses
    singular: nodeclass
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
# The default NodeClass, which Floci leaves out without a node role.
---
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: default
  labels:
    app.kubernetes.io/managed-by: eks
spec:
  role: "%ROLE%"
  subnetSelectorTerms:%SUBNET_TERMS%
  securityGroupSelectorTerms:%SECURITY_GROUP_TERMS%
  ephemeralStorage:
    size: 80Gi
    iops: 3000
    throughput: 125
  networkPolicy: DefaultAllow
  networkPolicyEventLogs: Disabled
  snatPolicy: Random
