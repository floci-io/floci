# AWS managed policy catalog.
#
# Floci resolves arn:aws:iam::aws:policy/* ARNs against this list, so an ARN absent here
# returns NoSuchEntity exactly as it does on real AWS. Seeding the real catalog is what
# keeps that check faithful in both directions: policies AWS publishes attach cleanly, and
# typos are still rejected.
#
# Policy documents are not modelled. Floci does not evaluate IAM by default and every entry
# resolves to the same permissive document, so only name, path and description are needed.
#
# Names and paths derive from the public AWS managed policy list, via
# https://github.com/iann0036/iam-dataset (MIT). To refresh against a real account:
#   aws iam list-policies --scope AWS
