# Test classes run concurrently against the one Floci; the methods of a class stay on one thread, in order.
# Most of the suite's time is spent waiting on containers Floci starts and on minute-aligned metric ticks,
# so a few classes at once overlap those waits. A class that changes account- or region-wide state carries
# @ResourceLock (shared with the classes that read that state) or @Isolated.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=3
junit.jupiter.execution.parallel.config.fixed.max-pool-size=3
