  codebuild: services/codebuild/CodeBuildJsonHandler.java
  codedeploy: services/codedeploy/CodeDeployJsonHandler.java
  codepipeline:
    sources:
      - services/codepipeline/CodePipelineService.java
    exclude_actions:                    # action providers and execution states, not actions
      - Abandoned
      - CodeBuild
      - CodeDeploy
      - CodePipeline
      - Failed
      - Lambda
      - LambdaInvoke
      - Stopped
      - Succeeded
      - VariableCheck
  cognito: services/cognito/CognitoJsonHandler.java
  config: services/configservice/ConfigServiceJsonHandler.java
  controltower:
