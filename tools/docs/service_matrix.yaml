# Rows whose count cannot be derived from their dispatchers, each with the reason. These
# are the only counts still kept by hand.
hand_counted:
  s3: one controller method answers many operations, picked by query-string subresources (?tagging, ?acl, ?versioning, ...)

# docs/services pages that intentionally have no Service Matrix row of their own.
facet_pages:
  - cloudfront-private-origin
  - cloudwatch-metric-filters-verification
