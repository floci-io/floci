      - { path: services/controltower/ControlTowerTagHandler.java, mode: tag_handler }
    rename_actions:
      Enable: EnableControl
      List: ListEnabledControls
      Get: GetEnabledControl
      Update: UpdateEnabledControl
      Reset: ResetEnabledControl
      Operation: GetControlOperation
  cur: services/cur/CurJsonHandler.java
  dynamodb: services/dynamodb/NativeDynamoDbJsonHandler.java
  dynamodb#streams: services/dynamodb/NativeDynamoDbStreamsJsonHandler.java
  ec2: services/ec2/Ec2QueryHandler.java
  ecr: services/ecr/EcrJsonHandler.java
  ecs: services/ecs/EcsJsonHandler.java
  eks:
    sources:
      - { path: services/eks/EksController.java, mode: rest }
      - { path: services/eks/EksService.java, mode: tag_handler }
    rename_actions:
      CreateNodeGroup: CreateNodegroup
      DescribeNodeGroup: DescribeNodegroup
      ListNodeGroups: ListNodegroups
      DeleteNodeGroup: DeleteNodegroup
  elastic-beanstalk: services/elasticbeanstalk/ElasticBeanstalkQueryHandler.java
  elb: services/elbv2/ElbV2QueryHandler.java
  elb-classic: services/elb/ElbClassicQueryHandler.java
  emr-serverless:
    sources:
      - { path: services/emrserverless/EmrServerlessController.java, mode: rest }
      - { path: services/emrserverless/EmrServerlessTagHandler.java, mode: tag_handler }
  glue: services/glue/GlueJsonHandler.java
  guardduty:
    sources:
      - { path: services/guardduty/GuardDutyController.java, mode: rest }
      - { path: services/securityadmin/SecurityAdminController.java, mode: rest, route_prefix: /admin }   # shared with Macie
      - { path: services/guardduty/GuardDutyTagHandler.java, mode: tag_handler }
    rename_actions:
