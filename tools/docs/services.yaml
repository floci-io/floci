  - { path: services/applicationautoscaling/ScalingPolicyAlarmActionHandler.java }  # not a JSON/Query action dispatcher — its `case "X" ->` arms are the StepScaling AdjustmentType switch, not AWS actions
  - { path: services/autoscaling/AutoScalingQueryHandler.java }  # non-tabular doc (grouped/inline)
  - { path: services/bcmpricingcalculator/BcmPricingCalculatorJsonHandler.java }  # focused workload-estimate surface
