  - { path: services/cloudcontrol/CloudControlJsonHandler.java }  # no standalone action table yet
  - { path: services/cloudmap/CloudMapHandler.java }  # non-tabular doc (grouped/inline)
  - { path: services/cloudwatch/logs/CloudWatchLogsHandler.java }  # multi-table doc (nested handler)
  - { path: services/cloudwatch/logs/CloudWatchLogsMetricFilterHandler.java }  # multi-table doc (nested handler, reached through CloudWatchLogsHandler)
  - { path: services/cloudwatch/metrics/CloudWatchMetricsJsonHandler.java }  # multi-table doc (nested handler)
  - { path: services/cloudwatch/metrics/CloudWatchMetricsQueryHandler.java }  # multi-table doc (nested handler)
  - { path: services/codebuild/CodeBuildJsonHandler.java }  # non-tabular doc (grouped/inline)
  - { path: services/codedeploy/CodeDeployJsonHandler.java }  # non-tabular doc (grouped/inline)
  - { path: services/cognito/CognitoJsonHandler.java }  # non-tabular doc (grouped/inline); separate docs effort
  - { path: services/configservice/ConfigServiceJsonHandler.java }  # non-tabular doc (grouped/inline)
  - { path: services/cur/CurJsonHandler.java }  # no standalone action table yet
  - { path: services/dynamodb/NativeDynamoDbJsonHandler.java }  # multi-table doc
  - { path: services/dynamodb/NativeDynamoDbStreamsJsonHandler.java }  # multi-table doc
  - { path: services/ec2/Ec2QueryHandler.java }  # non-tabular doc (grouped/inline)
  - { path: services/ecr/EcrJsonHandler.java }  # doc packs multiple actions per row (`A` / `B`) + REST endpoints; needs de-grouping
