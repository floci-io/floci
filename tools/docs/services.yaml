  - { path: services/lakeformation/LakeFormationJsonHandler.java }  # no standalone action table yet
  - { path: services/lightsail/LightsailJsonHandler.java }  # non-tabular doc (grouped/inline); standalone action table to be added
  - { path: services/pricing/PricingJsonHandler.java }  # no standalone action table yet
