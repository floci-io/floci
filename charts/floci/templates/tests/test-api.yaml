{{- $script := `
endpoint="$FLOCI_ENDPOINT"
aws --endpoint-url "$endpoint" sts get-caller-identity

bucket="helm-test-$(date +%s)"
aws --endpoint-url "$endpoint" s3 mb "s3://$bucket"
echo "hello from helm test" > /tmp/hello.txt
aws --endpoint-url "$endpoint" s3 cp /tmp/hello.txt "s3://$bucket/hello.txt"
aws --endpoint-url "$endpoint" s3 ls "s3://$bucket"
body="$(aws --endpoint-url "$endpoint" s3 cp "s3://$bucket/hello.txt" -)"
[ "$body" = "hello from helm test" ] || { echo "unexpected object body: $body"; exit 1; }
aws --endpoint-url "$endpoint" s3 rb --force "s3://$bucket"

# QueueUrl is built from the base URL the chart sets, so it must not name localhost.
queue_url="$(aws --endpoint-url "$endpoint" sqs create-queue --queue-name "$bucket" --query QueueUrl --output text)"
echo "QueueUrl: $queue_url"
case "$queue_url" in
  "$FLOCI_EFFECTIVE_BASE_URL"/*) ;;
  *) echo "QueueUrl does not start with $FLOCI_EFFECTIVE_BASE_URL"; exit 1 ;;
esac
aws --endpoint-url "$endpoint" sqs delete-queue --queue-url "$queue_url"
echo "API smoke test passed"
` }}
{{- include "floci.testPod" (dict "root" . "name" "api" "script" $script) }}
