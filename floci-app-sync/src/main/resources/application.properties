quarkus.application.name=floci-app-sync
quarkus.http.port=3010
quarkus.http.host=0.0.0.0

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] %s%e%n

# No persistent state on this side: every /execute call carries the resolver-wiring
# metadata it needs (see AppSyncEngineResource), and the compiled-schema cache in
# SchemaRegistry is rebuilt from Floci's rehydrate call on restart, same as Floci's
# own in-process SchemaRegistry does today.
