version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "com.networknt:json-schema-validator"
        versions: [">=2.0.0"]
    labels:
      - "dependencies"
      - "java"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"

  # botocore pins the AWS data src/main/resources/aws/*.json is generated from. A bump PR runs
  # the Partition Literals workflow, whose aws-data-check fails when the new release adds a
  # region, partition or service: run `make aws-data-sync` on the PR (after refreshing
  # local/aws/botocore to the same version) and commit the regenerated files.
  - package-ecosystem: "pip"
    directory: "/tools/aws"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "botocore"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
