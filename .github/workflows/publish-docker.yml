name: Publish Docker to GHCR

# Fork-only utility: builds a Floci Docker image from a chosen ref and pushes it to
# this fork's GitHub Container Registry namespace (ghcr.io/<owner>/floci). Kept off
# the feature branch so it never lands in the upstream PR. Trigger manually.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/ref to build and publish
        required: true
        default: feat/bedrock-agentcore
      tag:
        description: Image tag under ghcr.io/<owner>/floci
        required: true
        default: agentcore

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (JVM image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/floci:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/floci:${{ inputs.tag }}-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=floci-jvm
          cache-to: type=gha,scope=floci-jvm,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "- \`ghcr.io/${{ github.repository_owner }}/floci:${{ inputs.tag }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/floci:${{ inputs.tag }}-${{ steps.meta.outputs.sha }}\`"
            echo ""
            echo "Built from \`${{ inputs.ref }}\` @ ${{ steps.meta.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
