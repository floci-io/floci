name: Publish Sezame image

# Builds the JVM image and pushes ghcr.io/joinsezame/floci:<tag>.
# The pinned tag is 2.3.0-sezame.1. A tag push of 2.3.0-sezame.N publishes that name.
# This image is the API the Conduit probe runs. It is not the GraalVM native image.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: 2.3.0-sezame.1
        type: string
  push:
    tags:
      - "2.3.0-sezame.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push JVM image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package
        run: ./mvnw -B package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.jvm-package
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.name }}
          tags: |
            ghcr.io/joinsezame/floci:${{ steps.tag.outputs.name }}
            ghcr.io/joinsezame/floci:${{ steps.tag.outputs.name }}-jvm
