name: Docs Action Tables

# Keeps the generated tables in docs/services/*.md in sync with their sources: the
# "Supported Actions" tables with handler source, and the CloudFormation "Supported Resource
# Types" table with the provisioner inventory TSV. Runs on handler changes (which can add or
# remove actions), inventory changes (which add or move resource types), and on doc or tooling
# changes. Python-only, so it is fast and independent of the Java build job.

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/test/resources/cloudformation/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/docs/**'
      - 'Makefile'
      - '.github/workflows/docs-actions.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
      - 'src/test/resources/cloudformation/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/docs/**'
      - 'Makefile'
      - '.github/workflows/docs-actions.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-tables:
    name: Docs in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/docs/requirements.txt -r docs/requirements.txt

      - name: Run action-table tests
        run: make docs-test

      - name: Check action tables are in sync
        run: make docs-check

      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir /tmp/site
