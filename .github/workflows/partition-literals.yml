name: Partition Literals

# Keeps the commercial-partition assumption from growing back while floci moves to
# serving every AWS partition. tools/partition/partition_literals.py inventories the
# hardcoded arn:aws: prefixes, amazonaws.com hosts, hosted-zone ids and hand-rolled
# partition regexes in src/main/java against the checked-in per-file baseline: a
# literal in a new file fails, growth in an existing file fails, and a drop fails until
# the baseline is regenerated so the remaining count stays exact. The second job checks
# that the vendored AWS data (src/main/resources/aws/*.json) still matches what tools/aws/
# produces from the pinned botocore release. Python-only,
# so both are fast and independent of the Java build job.

on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/aws/**'
      - 'tools/partition/**'
      - 'tools/aws/**'
      - 'tools/slr/**'
      - 'src/main/resources/iam/service-linked-roles.tsv'
      - 'src/main/resources/iam/managed-policy-documents.json'
      - 'Makefile'
      - '.github/workflows/partition-literals.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/aws/**'
      - 'tools/partition/**'
      - 'tools/aws/**'
      - 'tools/slr/**'
      - 'src/main/resources/iam/service-linked-roles.tsv'
      - 'src/main/resources/iam/managed-policy-documents.json'
      - 'Makefile'
      - '.github/workflows/partition-literals.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  partition-literals:
    name: Partition literals match baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/partition/requirements.txt

      - name: Run partition tooling tests
        run: make partition-test

      - name: Check partition literals against the baseline
        run: make partition-check

      - name: Print the remaining-literal audit
        if: always()
        run: make partition-audit

  aws-data:
    name: Vendored AWS data in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install the pinned botocore
        run: pip install -r tools/aws/requirements.txt

      - name: Run generator tests
        run: make aws-data-test

      - name: Check partitions.json against a fresh generation
        run: make aws-data-check

      # Offline and hermetic, so it is safe on a job this broadly triggered. The online check
      # that needs AWS lives in iam-namespace-drift.yml, which only runs when the vendored file
      # or its generator changes, so an outage cannot fail an unrelated Java pull request.
      - name: Check the vendored IAM namespace list is well-formed
        run: make iam-namespaces-check

      # Also offline: the service-linked role table is checked against the vendored managed
      # policy documents in the repository, never against AWS. The half that comes from a
      # recorded create cannot be re-derived without the snapshot, which is why every row in
      # the table carries the source it rests on.
      - name: Run the service-linked role generator tests
        run: make slr-test

      - name: Check the service-linked role table against the vendored policy documents
        run: make slr-check

