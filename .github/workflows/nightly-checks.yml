name: Nightly checks

# Runs the test classes named *NightlyIntegrationTest: checks that pull or push images too large, or run too long,
# for every pull request's shards. Each such class skips unless the JVM has -Dnightly.checks.enabled=true, so the
# CI shards, which pick every *Test class, see it skip at no cost; this workflow sets the property. Its name is
# outside floci.*, whose names Floci's configuration validates: a Quarkus test given -Dfloci.nightly refuses to
# start. It runs once a day on main, on demand, and on a pull request that adds or changes a nightly check, so the
# check is seen to pass before it merges. A *DockerNightlyIntegrationTest is a container end-to-end check moved out of
# the shards to keep them short: a pull request runs the ones its change can reach (its service's package, a service
# the check imports, an image pin, a test helper the check names; .github/ci/select-nightly-checks.sh lists the rules),
# and the daily run catches what those rules miss. GitHub-hosted runners only, which a public repository runs at no
# charge.
on:
  schedule:
    # 08:00 UTC, after Nightly (23:00 America/Chicago) and away from the daytime merges' CI runs.
    - cron: '0 8 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/nightly-checks.yml'
      - '.github/ci/select-nightly-checks.sh'
      - '.github/ci/test_select_nightly_checks.py'
      - 'src/test/java/**'
      - 'src/test/resources/application.yml'
      - 'src/main/resources/application.yml'
      - 'src/main/java/io/floci/aws/config/**'
      - 'src/main/java/io/floci/aws/services/**'
      - 'src/main/java/io/floci/aws/core/common/docker/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One short job picks each group's checks, so a pull request that selects none of a group's checks, the usual case
  # for a src/main change, holds no runner for that group.
  select:
    name: Select the nightly checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork's schedule would spend its owner's minutes on checks it never asked for; a draft waits until it is
    # ready for review, as the CI shards do.
    if: >-
      (github.event_name != 'schedule' || !github.event.repository.fork) &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the selection
        run: python3 -m unittest discover -s .github/ci -p test_select_nightly_checks.py

      # Every test is a top-level class in src/test/java, so the file name is the class name, as ci.yml relies on.
      # On a pull request, only the checks its change can reach run, or all of them when it changes this workflow or
      # the selection; the script's header lists the rules.
      - name: List the nightly checks
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/ci/select-nightly-checks.sh

  checks:
    name: Nightly checks (${{ matrix.group }})
    needs: select
    if: needs.select.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Each group runs its checks one after another, within their own @Timeout bounds, plus about twenty minutes for
    # compilation, the image and the prefetch; together they would exceed the 360 minutes a hosted runner gives one
    # job. standard holds every check but the EMR Docker runner's, 339 minutes. docker-runner holds
    # EmrDockerRunnerNightlyIntegrationTest's eleven two-minute tests and two-minute setup,
    # EmrClusterShrinkNightlyIntegrationTest's sixteen-minute method and two-minute setup, and
    # EmrContainersSparkNightlyIntegrationTest's three six-minute methods, eleven-minute method, two-minute setup before
    # each and 21-minute image pull, EmrContainersGatewayNightlyIntegrationTest's twenty-four-minute, seven-minute and
    # eighteen-minute methods and 21-minute image pull, and EmrTrinoNightlyIntegrationTest's three seven-minute
    # methods and ten-minute image pull, 201 minutes. docker-e2e holds the *DockerNightlyIntegrationTest
    # classes, about 23 minutes of tests on 2026-11-23 when they still ran in the shards. A check added, or a bound
    # raised, raises its group's timeout with it, so a slow check fails with its own message.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the group's checks
        env:
          CLASSES: ${{ matrix.classes }}
        run: |
          tr ' ' '\n' <<< "$CLASSES" > nightly.txt
          echo "$(wc -l < nightly.txt | tr -d ' ') nightly checks"
          cat nightly.txt

      # The checks' images run to several gigabytes, a pushed copy of one included, and the runner's disk holds
      # toolchains they never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          # no `cache: maven`, as in ci.yml; main's cache is restored below.

      # Restored only: ci.yml saves main's copy under this key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # The Maven distribution ./mvnw runs, saved by ci.yml on main, so this job does not fetch it from
      # Maven Central with the wrapper's one unretried wget.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Prefetch the checks' Docker images (background)
        run: .github/ci/prefetch-images.sh nightly.txt || true

      - name: Compile
        run: ./mvnw test-compile -B

      # A check that runs Floci in a container, as a user's Docker setup does, runs this image: this commit's own
      # build, made from the compiled application as docker/Dockerfile.jvm-package describes.
      - name: Build the Floci image
        if: matrix.group == 'standard'
        run: |
          ./mvnw package -B -q -DskipTests
          docker build -q -f docker/Dockerfile.jvm-package -t floci/floci:nightly-check .

      # DynamoDbLocalBackendDockerNightlyIntegrationTest serves the DynamoDB API from an external DynamoDB Local, the
      # image and version docs/services/dynamodb.md shows. Only that backend reads the variable.
      - name: Start DynamoDB Local
        id: dynamodb-local
        if: matrix.group == 'docker-e2e' && contains(matrix.classes, 'DynamoDbLocalBackendDockerNightlyIntegrationTest')
        run: |
          docker run -d --name dynamodb-local -p 127.0.0.1:8000:8000 amazon/dynamodb-local:3.3.1
          echo "endpoint=http://127.0.0.1:8000" >> "$GITHUB_OUTPUT"

      # nightly.txt is never empty here: the select job leaves a group with no checks out of the matrix, and an empty
      # includesFile would make surefire run the whole suite.
      - name: Run the nightly checks
        env:
          FLOCI_SERVICES_DYNAMODB_LOCAL_ENDPOINT: ${{ steps.dynamodb-local.outputs.endpoint }}
        run: >
          ./mvnw surefire:test -B
          -Dsurefire.includesFile="$GITHUB_WORKSPACE/nightly.txt"
          -DfailIfNoTests=true
          -Dnightly.checks.enabled=true
          -Dnightly.checks.floci-image=floci/floci:nightly-check

      - name: Image prefetch results
        if: always()
        run: |
          cat prefetch-images.log 2>/dev/null || echo "no prefetch log"
          grep -E 'stale prefetch key|prefetch skipped|prefetch failed' prefetch-images.log 2>/dev/null \
            | sed 's/^/::warning title=prefetch-images.sh::/' || true

      - name: Upload the checks' results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-checks-${{ matrix.group }}
          path: |
            nightly.txt
            prefetch-images.log
            target/surefire-reports/
          if-no-files-found: warn
