name: GHCR Publish

# Fork automation: publishes ghcr.io/lex00/floci on every push to main and on
# version tag pushes, so the fork's fixes are pullable without waiting on a
# tagged release. Complements the manual `publish-docker.yml` (workflow_dispatch,
# arbitrary ref/tag) with an automatic trigger, and mirrors its multi-arch
# build-by-digest-then-merge approach so both amd64 CI hosts and arm64 Macs can
# pull the result. Uses the standard GITHUB_TOKEN with packages: write - no
# additional secrets required.
#
# Published tags:
#   main push:  ghcr.io/lex00/floci:latest        ghcr.io/lex00/floci:<short-sha>
#   tag push:   ghcr.io/lex00/floci:<tag>          ghcr.io/lex00/floci:<short-sha>

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/floci

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Platform slug
        id: slug
        run: echo "value=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=floci-ghcr-publish-${{ steps.slug.outputs.value }}
          cache-to: type=gha,scope=floci-ghcr-publish-${{ steps.slug.outputs.value }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags for this push
        id: tags
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          tags="-t ${{ env.IMAGE }}:${short_sha}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${tags} -t ${{ env.IMAGE }}:${{ github.ref_name }}"
          else
            tags="${tags} -t ${{ env.IMAGE }}:latest"
          fi
          echo "flags=${tags}" >> "$GITHUB_OUTPUT"
          echo "primary=${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.flags }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.tags.outputs.primary }}
