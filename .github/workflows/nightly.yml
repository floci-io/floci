name: Nightly

# Builds and publishes native images from the tip of main as nightly Docker tags.
# Runs every night at 22:00 CT (03:00 UTC, approximate — shifts 1 h in CST winter).
# Can also be triggered manually.
#
# Published tags:
#   Native:  floci/floci:nightly   floci/floci:nightly-mmddyyyy
#   Compat:  floci/floci:nightly-compat   floci/floci:nightly-mmddyyyy-compat
#   GHCR mirrors the same tags under ghcr.io/<owner>/floci.
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, AWS_ROLE_ARN
# GHCR pushes authenticate with the built-in GITHUB_TOKEN, so forks get
# working image publishing without configuring any secrets.

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:        # Allow maintainers to trigger manually

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Compute nightly version (CT date) ────────────────────────────────────
  prepare:
    name: Prepare nightly version
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || !github.event.repository.fork
    outputs:
      version: ${{ steps.date.outputs.version }}

    steps:
      - name: Set date version (CT)
        id: date
        run: echo "version=$(TZ='America/Chicago' date +'%m%d%Y')" >> "$GITHUB_OUTPUT"

  # ── Build native artifact — amd64 ────────────────────────────────────────
  build-native-amd64:
    name: Build native artifact (amd64)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: main

      - uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set nightly version
        run: mvn versions:set -DnewVersion="nightly-${{ needs.prepare.outputs.version }}" -DgenerateBackupPoms=false -q

      - name: Build native executable
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-march=x86-64-v2"

      - uses: actions/upload-artifact@v7
        with:
          name: native-amd64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Build native artifact — arm64 ────────────────────────────────────────
  build-native-arm64:
    name: Build native artifact (arm64)
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: main

      - uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set nightly version
        run: mvn versions:set -DnewVersion="nightly-${{ needs.prepare.outputs.version }}" -DgenerateBackupPoms=false -q

      - name: Build native executable
        run: mvn clean package -Dnative -DskipTests -B

      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Push native + compat Docker images ───────────────────────────────────
  push-native:
    name: Push native and compat Docker images
    needs: [prepare, build-native-amd64, build-native-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: native-amd64
          path: native/amd64/

      - uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: native/arm64/

      - name: Make binaries executable
        run: chmod +x native/amd64/*-runner native/arm64/*-runner

      - name: Set created timestamp
        id: created
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      # Tags are computed here so registries degrade gracefully: Docker Hub
      # and ECR Public tags are included only when their secrets exist (forks
      # usually have none), while GHCR always works via the built-in
      # GITHUB_TOKEN. GHCR image names must be lowercase;
      # github.repository_owner may not be.
      - name: Compute image tags
        id: tags
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_ECR: ${{ secrets.AWS_ROLE_ARN != '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/floci"
          {
            echo "native<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "floci/floci:nightly"
              echo "floci/floci:nightly-${VERSION}"
            fi
            if [ "$HAS_ECR" = "true" ]; then
              echo "public.ecr.aws/floci/floci:nightly"
              echo "public.ecr.aws/floci/floci:nightly-${VERSION}"
            fi
            echo "${ghcr}:nightly"
            echo "${ghcr}:nightly-${VERSION}"
            echo "EOF"
            echo "compat<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "floci/floci:nightly-compat"
              echo "floci/floci:nightly-${VERSION}-compat"
            fi
            if [ "$HAS_ECR" = "true" ]; then
              echo "public.ecr.aws/floci/floci:nightly-compat"
              echo "public.ecr.aws/floci/floci:nightly-${VERSION}-compat"
            fi
            echo "${ghcr}:nightly-compat"
            echo "${ghcr}:nightly-${VERSION}-compat"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push native nightly image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.native }}
          labels: |
            org.opencontainers.image.version=nightly-${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=nightly-${{ needs.prepare.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push compat nightly image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.compat
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.compat }}
          build-args: |
            VERSION=nightly-${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=nightly-${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=nightly-${{ needs.prepare.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
