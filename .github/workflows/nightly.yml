name: Nightly

# Builds and publishes native images from the tip of main as nightly Docker tags.
# Runs every night at 23:00 America/Chicago (04:00 UTC in CDT, 05:00 UTC in CST).
# GitHub may delay scheduled runs on low-activity repositories; observed delays on this
# org have reached several hours. The schedule is a target, not a guarantee.
# Can also be triggered manually.
#
# Published tags:
#   Native:  floci/floci:nightly   floci/floci:nightly-mmddyyyy
#   Compat:  floci/floci:nightly-compat   floci/floci:nightly-mmddyyyy-compat
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, AWS_ROLE_ARN

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:        # Allow maintainers to trigger manually

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Compute nightly version (CT date) ────────────────────────────────────
  prepare:
    name: Prepare nightly version
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || !github.event.repository.fork
    outputs:
      version: ${{ steps.date.outputs.version }}

    steps:
      - name: Set date version (CT)
        id: date
        run: echo "version=$(TZ='America/Chicago' date +'%m%d%Y')" >> "$GITHUB_OUTPUT"

  # ── Build native artifact: amd64 ─────────────────────────────────────────
  build-native-amd64:
    name: Build native artifact (amd64)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          # no `cache: maven`, since it could never hit here. Its restore hashes the
          # pristine pom.xml, but its post-job save runs *after* `versions:set`
          # below has rewritten that pom, so the two keys never match. Worse, the
          # nightly version embeds the date, so the save key changed every night:
          # 08-28 saved ...0d0497deb231, 08-29 saved ...476d856e99e8. Nightly was
          # writing 222 MB per job per night under a key nothing would ever read.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore-only, keyed identically to ci.yml so this reads the ~/.m2 that
      # ci.yml's shard 1 saves on every push to main. This job checks out `ref:
      # main`, so the pristine pom hashed here matches the one ci.yml hashed,
      # and restoring before `versions:set` keeps it that way. Nothing is saved:
      # ci.yml is the single writer, and a save here would recreate the mutated-
      # key garbage described above.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Set nightly version
        run: mvn versions:set -DnewVersion="nightly-${{ needs.prepare.outputs.version }}" -DgenerateBackupPoms=false -q

      - name: Build native executable
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-march=x86-64-v2"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-amd64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Build native artifact: arm64 ─────────────────────────────────────────
  build-native-arm64:
    name: Build native artifact (arm64)
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          # no `cache: maven`, since it could never hit here. Its restore hashes the
          # pristine pom.xml, but its post-job save runs *after* `versions:set`
          # below has rewritten that pom, so the two keys never match. Worse, the
          # nightly version embeds the date, so the save key changed every night:
          # 08-28 saved ...0d0497deb231, 08-29 saved ...476d856e99e8. Nightly was
          # writing 222 MB per job per night under a key nothing would ever read.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore-only, keyed identically to ci.yml so this reads the ~/.m2 that
      # ci.yml's shard 1 saves on every push to main. This job checks out `ref:
      # main`, so the pristine pom hashed here matches the one ci.yml hashed,
      # and restoring before `versions:set` keeps it that way. Nothing is saved:
      # ci.yml is the single writer, and a save here would recreate the mutated-
      # key garbage described above.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Set nightly version
        run: mvn versions:set -DnewVersion="nightly-${{ needs.prepare.outputs.version }}" -DgenerateBackupPoms=false -q

      - name: Build native executable
        run: mvn clean package -Dnative -DskipTests -B

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-arm64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Push native + compat Docker images ───────────────────────────────────
  push-native:
    name: Push native and compat Docker images
    needs: [prepare, build-native-amd64, build-native-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-amd64
          path: native/amd64/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-arm64
          path: native/arm64/

      - name: Stage binaries under a fixed name
        run: |
          for arch in amd64 arm64; do
            mv native/$arch/*-runner native/$arch/application
          done

      - name: Set created timestamp
        id: created
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registry-type: public

      - name: Build and push native nightly image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            floci/floci:nightly
            floci/floci:nightly-${{ needs.prepare.outputs.version }}
            public.ecr.aws/floci/floci:nightly
            public.ecr.aws/floci/floci:nightly-${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=nightly-${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=nightly-${{ needs.prepare.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push compat nightly image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.compat
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            floci/floci:nightly-compat
            floci/floci:nightly-${{ needs.prepare.outputs.version }}-compat
            public.ecr.aws/floci/floci:nightly-compat
            public.ecr.aws/floci/floci:nightly-${{ needs.prepare.outputs.version }}-compat
          build-args: |
            VERSION=nightly-${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=nightly-${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=nightly-${{ needs.prepare.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
