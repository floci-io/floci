name: Release

# Triggered when a version tag (e.g. 1.2.3) is pushed.
# Builds native (amd64 + arm64) Docker images and pushes them to Docker Hub
# and Amazon ECR Public, and publishes standalone floci-aws binaries for Linux,
# macOS and Windows as GitHub Release assets.
#
# Published tags:
#   Native:  floci/floci:1.2.3        floci/floci:latest
#            public.ecr.aws/floci/floci:1.2.3        public.ecr.aws/floci/floci:latest
#   Baseline: floci/floci:1.2.3-baseline floci/floci:latest-baseline
#             public.ecr.aws/floci/floci:1.2.3-baseline public.ecr.aws/floci/floci:latest-baseline
#   Compat:  floci/floci:1.2.3-compat floci/floci:latest-compat
#            public.ecr.aws/floci/floci:1.2.3-compat public.ecr.aws/floci/floci:latest-compat
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, AWS_ROLE_ARN

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Only the jobs that need an OIDC token request one: push-native (assume the
# AWS role for ECR Public) and sign-images (that, plus a Fulcio certificate).
permissions:
  contents: read

# Per-tag concurrency. Back-to-back tag pushes (e.g. 1.5.3 and 1.6.0 landing
# minutes apart) resolve to different ${{ github.ref }} values, so they run
# in parallel rather than cancelling each other. Re-runs of the same tag
# supersede in-flight builds of that tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build native artifact — amd64 ────────────────────────────────────────
  build-native-amd64:
    name: Build native artifact (amd64)
    # Pinned, like the arm64 jobs. Built on ubuntu-26.04 the binary asks glibc for x86-64-v3
    # whatever -march says, and no longer starts on x86-64-v2 CPUs.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        # Quarkus 3.39 switches on -H:+AOTSingleCallsiteInline for Mandrel 25.0.4+. The generated
        # REST invokers for AwsQueryController.dispatch and AwsJson11Controller.handle are each the
        # single call site of a very large method; inlined, the method outgrows the aarch64
        # conditional-branch range and the build dies with BranchTargetOutOfBoundsException.
        # The flag only exists on Mandrel, so it is passed here rather than in application.yml.
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-march=x86-64-v2,-H:-AOTSingleCallsiteInline"

      - name: Check the x86-64 ISA level of the binary
        # The image and the release asset must run on x86-64-v2 CPUs. The runner's CPU has v3, so
        # starting the binary here proves nothing; the script reads the ISA level the binary asks
        # glibc for.
        run: .github/scripts/check-isa-level.sh "$(ls target/*-runner)"

      - name: Smoke-test the standalone binary
        # The same binary is published as a release asset (publish-binaries), so it is checked
        # the way a user runs it: on the host, no Docker image around it.
        run: .github/scripts/smoke-binary.sh "$(ls target/*-runner)" "$GITHUB_REF_NAME"

      - name: Check the glibc floor of the standalone binary
        # The release asset links glibc dynamically and must run on 2.34 (RHEL 9, Debian 12,
        # Ubuntu 22.04, Amazon Linux 2023). The script checks the symbol versions it requires and
        # starts it in UBI 9, whose glibc is exactly 2.34.
        run: .github/scripts/check-glibc-floor.sh "$(ls target/*-runner)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-amd64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          # Long enough to re-run publish-binaries on its own after a failure.
          retention-days: 7

  # ── Build native artifact — arm64 ────────────────────────────────────────
  build-native-arm64:
    name: Build native artifact (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        # Quarkus 3.39 switches on -H:+AOTSingleCallsiteInline for Mandrel 25.0.4+. The generated
        # REST invokers for AwsQueryController.dispatch and AwsJson11Controller.handle are each the
        # single call site of a very large method; inlined, the method outgrows the aarch64
        # conditional-branch range and the build dies with BranchTargetOutOfBoundsException.
        # The flag only exists on Mandrel, so it is passed here rather than in application.yml.
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-H:-AOTSingleCallsiteInline"

      - name: Smoke-test the standalone binary
        # The same binary is published as a release asset (publish-binaries), so it is checked
        # the way a user runs it: on the host, no Docker image around it.
        run: .github/scripts/smoke-binary.sh "$(ls target/*-runner)" "$GITHUB_REF_NAME"

      - name: Check the glibc floor of the standalone binary
        run: .github/scripts/check-glibc-floor.sh "$(ls target/*-runner)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          # Long enough to re-run publish-binaries on its own after a failure.
          retention-days: 7

  # ── Build baseline native artifact — arm64 only ─────────────────────────
  build-native-arm64-baseline:
    name: Build baseline native artifact (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARMv8.0 baseline native executable
        # Keep the normal arm64 artifact optimized as before. This additional release-only build
        # targets ARMv8.0 explicitly so older cores such as Raspberry Pi 4's Cortex-A72 do not
        # inherit optional AArch64 features (notably LSE) from the GitHub-hosted build runner.
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-march=armv8-a,-H:-AOTSingleCallsiteInline"

      - name: Smoke-test the standalone binary
        # The same binary is published as a release asset (publish-binaries), so it is checked
        # the way a user runs it: on the host, no Docker image around it.
        run: .github/scripts/smoke-binary.sh "$(ls target/*-runner)" "$GITHUB_REF_NAME"

      - name: Check the glibc floor of the standalone binary
        run: .github/scripts/check-glibc-floor.sh "$(ls target/*-runner)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64-baseline
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          # Long enough to re-run publish-binaries on its own after a failure.
          retention-days: 7

  # ── Build standalone binaries — macOS and Windows ───────────────────────
  # The Linux release binaries are the native-amd64, native-arm64 and native-arm64-baseline
  # artifacts above, which also go into the images. macOS and Windows are built only for the
  # release assets. Mandrel has no macOS distribution, so both use GraalVM Community, which has
  # no -H:-AOTSingleCallsiteInline option to pass.
  build-binary-darwin-arm64:
    name: Build standalone binary (darwin-arm64)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        run: mvn clean package -Dnative -DskipTests -B

      - name: Smoke-test the standalone binary
        run: .github/scripts/smoke-binary.sh "$(ls target/*-runner)" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-darwin-arm64
          path: target/*-runner
          if-no-files-found: error
          retention-days: 7

  build-binary-darwin-amd64:
    name: Build standalone binary (darwin-amd64, Rosetta)
    # native-image cannot cross-compile, and Intel macOS runners queue for hours, so an x86_64
    # GraalVM runs under Rosetta 2 on the Apple Silicon runner (floci-cli's recipe).
    # setup-graalvm has no architecture override, so the x86_64 JDK is installed by hand: GraalVM
    # Community, like the other binaries, pinned to 25.0.1 (the last release with a macOS x64 build)
    # and checked against its published SHA-256 before anything built with it is signed.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 GraalVM
        env:
          GRAALVM_X64_URL: https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-25.0.1/graalvm-community-jdk-25.0.1_macos-x64_bin.tar.gz
          GRAALVM_X64_SHA256: a3d895b4cd1c783badbd277ec70409806bd4102fca0d2a60dbaeb0bab41aec30
        run: |
          curl -fsSL -o "$RUNNER_TEMP/graalvm-x64.tar.gz" "$GRAALVM_X64_URL"
          echo "$GRAALVM_X64_SHA256  $RUNNER_TEMP/graalvm-x64.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/graalvm-x64"
          tar -xzf "$RUNNER_TEMP/graalvm-x64.tar.gz" -C "$RUNNER_TEMP/graalvm-x64" --strip-components 1
          echo "JAVA_HOME=$RUNNER_TEMP/graalvm-x64/Contents/Home" >> "$GITHUB_ENV"
          echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm-x64/Contents/Home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/graalvm-x64/Contents/Home/bin" >> "$GITHUB_PATH"

      - name: Build native executable (x86_64 under Rosetta)
        run: arch -x86_64 mvn clean package -Dnative -DskipTests -B

      - name: Verify the binary is x86_64
        run: file target/*-runner | grep -q x86_64

      - name: Smoke-test the standalone binary
        run: arch -x86_64 .github/scripts/smoke-binary.sh "$(ls target/*-runner)" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-darwin-amd64
          path: target/*-runner
          if-no-files-found: error
          retention-days: 7

  build-binary-windows-amd64:
    name: Build standalone binary (windows-amd64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        # Keeps the Windows snappy-java and JNA dispatch libraries every other build excludes
        # (see quarkus.native.resources in application.yml).
        shell: bash
        run: >-
          mvn clean package -Dnative -DskipTests -B
          "-Dfloci.native.windows-jni-include=*"
          -Dfloci.native.windows-jni-exclude=none

      - name: Smoke-test the standalone binary
        shell: bash
        run: .github/scripts/smoke-binary.sh "$(ls target/*-runner.exe)" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-windows-amd64
          path: target/*-runner.exe
          if-no-files-found: error
          retention-days: 7

  # ── Publish standalone binaries to the GitHub Release ────────────────────
  # semantic-release pushes this tag and then creates the release (notes only); the upload step
  # waits for the release to exist. This job adds
  # one raw executable per platform, sha256sums.txt, a keyless cosign bundle per file, and a
  # GitHub build-provenance attestation. It is the only job that writes to the release.
  # Verify a download with:
  #   sha256sum --ignore-missing -c sha256sums.txt
  #   cosign verify-blob floci-aws-linux-amd64 --bundle floci-aws-linux-amd64.sigstore.json \
  #     --certificate-identity-regexp '^https://github.com/floci-io/floci/.github/workflows/release.yml@' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  #   gh attestation verify floci-aws-linux-amd64 --repo floci-io/floci
  publish-binaries:
    name: Publish standalone binaries
    needs:
      - build-native-amd64
      - build-native-arm64
      - build-native-arm64-baseline
      - build-binary-darwin-arm64
      - build-binary-darwin-amd64
      - build-binary-windows-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Stage the release assets
        run: |
          set -euo pipefail
          mkdir dist
          stage() { local src=("artifacts/$1"/*-runner*); install -m 755 "${src[0]}" "dist/$2"; }
          stage native-amd64 floci-aws-linux-amd64
          stage native-arm64 floci-aws-linux-arm64
          stage native-arm64-baseline floci-aws-linux-arm64-baseline
          stage binary-darwin-arm64 floci-aws-darwin-arm64
          stage binary-darwin-amd64 floci-aws-darwin-amd64
          stage binary-windows-amd64 floci-aws-windows-amd64.exe
          (cd dist && sha256sum floci-aws-* > sha256sums.txt)
          ls -l dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign the release assets
        working-directory: dist
        run: |
          for f in floci-aws-* sha256sums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/floci-aws-*

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # The tag starts this workflow before semantic-release creates the GitHub Release, so wait
        # for it (up to 10 minutes) instead of failing the upload. --clobber makes a re-run idempotent.
        run: |
          for _ in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            echo "waiting for the $GITHUB_REF_NAME release to exist"; sleep 20
          done
          gh release view "$GITHUB_REF_NAME" > /dev/null || { echo "::error::release $GITHUB_REF_NAME not found after 10 minutes"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # ── Push native + compat Docker images ───────────────────────────────────
  push-native:
    name: Push native and compat Docker images
    needs: [build-native-amd64, build-native-arm64, build-native-arm64-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    # Consumed by sign-images. Each is the digest of the pushed manifest index,
    # which is what cosign signs; the tags above are mutable, the digests are not.
    outputs:
      native-digest: ${{ steps.native.outputs.digest }}
      baseline-digest: ${{ steps.baseline.outputs.digest }}
      compat-digest: ${{ steps.compat.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set created timestamp
        id: created
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-amd64
          path: native/amd64/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64
          path: native/arm64/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64-baseline
          path: native-baseline/arm64/

      - name: Stage binaries under a fixed name
        run: |
          for arch in amd64 arm64; do
            mv native/$arch/*-runner native/$arch/application
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Build and push native multi-arch image
        id: native
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            floci/floci:${{ steps.version.outputs.version }}
            floci/floci:latest
            public.ecr.aws/floci/floci:${{ steps.version.outputs.version }}
            public.ecr.aws/floci/floci:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=${{ steps.version.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ordering matters: this step wipes native/ and replaces it with the arm64-only
      # baseline binary. It is safe only because it runs AFTER the multi-arch image
      # above has been pushed, and nothing that follows reads native/ from the build
      # context: the compat image pulls its base (BASE_IMAGE) from the registry.
      # Moving this step above
      # the multi-arch push would silently publish `latest` from the baseline binary.
      - name: Stage ARMv8.0 baseline artifact under the native package path
        run: |
          rm -rf native/amd64 native/arm64
          mkdir -p native/arm64
          cp -a native-baseline/arm64/. native/arm64/
          mv native/arm64/*-runner native/arm64/application

      - name: Build and push ARMv8.0 baseline image
        id: baseline
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            floci/floci:${{ steps.version.outputs.version }}-baseline
            floci/floci:latest-baseline
            public.ecr.aws/floci/floci:${{ steps.version.outputs.version }}-baseline
            public.ecr.aws/floci/floci:latest-baseline
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=${{ steps.version.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha,scope=floci-arm64-baseline
          cache-to: type=gha,scope=floci-arm64-baseline,mode=max

      - name: Build and push compat multi-arch image
        id: compat
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.compat
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            floci/floci:${{ steps.version.outputs.version }}-compat
            floci/floci:latest-compat
            public.ecr.aws/floci/floci:${{ steps.version.outputs.version }}-compat
            public.ecr.aws/floci/floci:latest-compat
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=${{ steps.version.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Sign the published images ────────────────────────────────────────────
  # Kept out of push-native on purpose: a Fulcio or Rekor outage mid-push would
  # otherwise leave `latest` updated while -baseline and -compat never publish,
  # and recovery would mean rebuilding everything. Signing only reads digests
  # that are already in the registries, so this job can be rerun on its own.
  sign-images:
    name: Sign published images
    needs: push-native
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Cosign
        # Keyless signing: the job's GitHub Actions OIDC token exchanges for a
        # short-lived Fulcio certificate and the signature is recorded in Rekor's
        # transparency log. No signing key to generate, store, or rotate.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # cosign writes each signature back to the registry beside the image it
      # signs, so both destinations need a logged-in session here as well.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Sign images and their provenance/SBOM attestations
        # --recursive signs the pushed index and every manifest it references,
        # which includes the provenance/sbom attestation manifests BuildKit
        # attaches, not just the per-platform images. Those attestations are
        # unsigned in-toto JSON rather than cosign's own DSSE envelope, so a
        # consumer verifies them with `cosign verify` against the attestation
        # manifest's own digest (found via `docker buildx imagetools inspect`),
        # not `cosign verify-attestation`.
        env:
          DIGESTS: >-
            ${{ needs.push-native.outputs.native-digest }}
            ${{ needs.push-native.outputs.baseline-digest }}
            ${{ needs.push-native.outputs.compat-digest }}
        run: |
          for digest in $DIGESTS; do
            cosign sign --yes --recursive "floci/floci@${digest}"
            cosign sign --yes --recursive "public.ecr.aws/floci/floci@${digest}"
          done
