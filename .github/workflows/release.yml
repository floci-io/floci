name: Release

# Triggered when a version tag (e.g. 1.2.3) is pushed.
# Builds native (amd64 + arm64) Docker images and pushes them to Docker Hub
# and GitHub Container Registry.
#
# Published tags:
#   Native:  floci/floci:1.2.3        floci/floci:latest
#   Compat:  floci/floci:1.2.3-compat floci/floci:latest-compat
#   GHCR mirrors the same tags under ghcr.io/<owner>/floci.
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# GHCR pushes authenticate with the built-in GITHUB_TOKEN, so forks get
# working image publishing without configuring any secrets.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

# Per-tag concurrency. Back-to-back tag pushes (e.g. 1.5.3 and 1.6.0 landing
# minutes apart) resolve to different ${{ github.ref }} values, so they run
# in parallel rather than cancelling each other. Re-runs of the same tag
# supersede in-flight builds of that tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build native artifact — amd64 ────────────────────────────────────────
  build-native-amd64:
    name: Build native artifact (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-march=x86-64-v2"

      - uses: actions/upload-artifact@v7
        with:
          name: native-amd64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Build native artifact — arm64 ────────────────────────────────────────
  build-native-arm64:
    name: Build native artifact (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        run: mvn clean package -Dnative -DskipTests -B

      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Push native + compat Docker images ───────────────────────────────────
  push-native:
    name: Push native and compat Docker images
    needs: [build-native-amd64, build-native-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Tags are computed here so registries degrade gracefully: Docker Hub
      # tags are included only when its secrets exist (forks usually have
      # none), while GHCR always works via the built-in GITHUB_TOKEN.
      # GHCR image names must be lowercase; github.repository_owner may not be.
      - name: Compute image tags
        id: tags
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/floci"
          {
            echo "native<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "floci/floci:${VERSION}"
              echo "floci/floci:latest"
            fi
            echo "${ghcr}:${VERSION}"
            echo "${ghcr}:latest"
            echo "EOF"
            echo "compat<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "floci/floci:${VERSION}-compat"
              echo "floci/floci:latest-compat"
            fi
            echo "${ghcr}:${VERSION}-compat"
            echo "${ghcr}:latest-compat"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set created timestamp
        id: created
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: native-amd64
          path: native/amd64/

      - uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: native/arm64/

      - name: Make binaries executable
        run: chmod +x native/amd64/*-runner native/arm64/*-runner

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native multi-arch image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.native }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=${{ steps.version.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push compat multi-arch image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.compat
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.compat }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=${{ steps.version.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
